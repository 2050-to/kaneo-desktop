# Vermillion Daydream — built-in theme
#
# Source palette: https://colorhunt.co/palette/f63049d027528a244b111f35
#   #f63049 vermillion · #d02752 raspberry · #8a244b wine · #111f35 ink navy
#
# A hot-flower palette on ink navy. Dark is the palette's own reading; light
# mode grows the rose family out of the wine. Destructive is the raspberry —
# the one red in the palette that carries white button text.

name: "Vermillion Daydream"
description: "Vermillion, raspberry and wine over ink navy, in both modes."

light:
  # Surfaces ----------------------------------------------------------------
  background: "#fdf3f4" # rose paper grown out of the wine
  # The sidebar is rose cream, not the wine: Kaneo's settings layout paints
  # its tab strip and outer shell with bg-sidebar while inactive labels stay
  # muted-foreground, so the surface has to host dark inks. The wine keeps
  # its presence in the charts and dark mode.
  sidebar: "#f6e0e4"
  card: "#ffffff"
  popover: "#fef9fa"
  muted: "#111f3514"
  accent: "#111f3514"
  secondary: "#111f3514"
  code: "#ffffff"
  code-highlight: "#111f3514"

  # Text --------------------------------------------------------------------
  foreground: "#111f35" # the palette's ink navy, 15.18:1 on the canvas
  card-foreground: "#111f35"
  popover-foreground: "#111f35"
  muted-foreground: "#6d4a56" # wine, inked; 6.04:1 on the sidebar, 6.98:1 on the canvas, 7.60:1 on cards
  accent-foreground: "#111f35"
  secondary-foreground: "#111f35"
  code-foreground: "#111f35"
  sidebar-foreground: "#111f35" # 13.14:1 on the sidebar

  # Brand and emphasis ------------------------------------------------------
  # Raspberry, not vermillion: it carries white button text at 5.13:1 and
  # still reads as text on the canvas at 4.71:1.
  primary: "#d02752" # 4.71:1 as text on the canvas
  primary-foreground: "#ffffff" # 5.13:1 on primary

  # Borders, inputs, focus --------------------------------------------------
  border: "#111f3526" # decorative hairline; not an affordance
  input: "#a05a68" # 4.64:1 on the canvas, 5.05:1 on cards
  sidebar-border: "#111f3524"
  sidebar-ring: "#d02752" # raspberry; 4.08:1 on the sidebar
  sidebar-primary: "#d02752"
  sidebar-primary-foreground: "#ffffff" # 5.13:1 on sidebar-primary
  sidebar-accent: "#111f3514"
  sidebar-accent-foreground: "#111f35"

  # Status ------------------------------------------------------------------
  # Fills darkened from Kaneo's defaults so they clear 3:1 as icons and carry
  # white button text at 4.5:1; the badge texts keep the raspberry hue.
  destructive: "#d83d3d" # white text 4.51:1
  destructive-foreground: "#bf244b" # 4.88:1 on its own tint
  success: "#0c875e" # white text 4.52:1
  success-foreground: "#0a7451" # 4.83:1 on its own tint
  warning: "#a56a07" # white text 4.50:1
  warning-foreground: "#904207" # 4.87:1 on its own tint
  info: "#3473db" # white text 4.54:1
  info-foreground: "#1d4ed8" # 5.85:1 on its own tint

  # Data visualisation (reserved: nothing consumes these yet) ----------------
  chart-1: "#d02752"
  chart-2: "#f63049"
  chart-3: "#8a244b"
  chart-4: "#111f35"
  chart-5: "#c99a2e"

dark:
  # Surfaces ----------------------------------------------------------------
  background: "#111f35" # the palette's ink navy
  card: "#182338" # ink navy, lifted one step
  popover: "#0d1626"
  sidebar: "#0d1626"
  muted: "#ffeff014"
  accent: "#ffeff014"
  secondary: "#ffeff014"
  code: "#182338"
  code-highlight: "#ffeff01a"

  # Text --------------------------------------------------------------------
  foreground: "#ffeff0" # warm white, 14.83:1 on the canvas
  card-foreground: "#ffeff0"
  popover-foreground: "#ffeff0"
  muted-foreground: "#c797a1" # rose, 6.58:1 on the canvas
  accent-foreground: "#ffeff0"
  secondary-foreground: "#ffeff0"
  code-foreground: "#ffeff0"
  sidebar-foreground: "#c797a1" # 7.22:1 on the sidebar

  # Brand and emphasis ------------------------------------------------------
  primary: "#d02752" # raspberry; 3.22:1 as text on the canvas
  primary-foreground: "#ffffff" # 5.13:1 on primary

  # Borders, inputs, focus --------------------------------------------------
  border: "#ffeff01f" # decorative hairline; not an affordance
  input: "#6b7288" # 3.45:1 on the canvas, 3.28:1 on cards
  ring: "#f63049" # the palette's vermillion, 4.28:1 on the canvas
  sidebar-border: "#ffeff024"
  sidebar-ring: "#f63049" # 5.20:1 on the sidebar
  sidebar-primary: "#d02752"
  sidebar-primary-foreground: "#ffffff" # 5.13:1 on sidebar-primary
  sidebar-accent: "#ffeff014"
  sidebar-accent-foreground: "#ffeff0"

  # Status ------------------------------------------------------------------
  # Destructive is the palette's raspberry: it carries white text at 5.13:1
  # and stays a 3:1 icon on cards, so this theme keeps the standard dark
  # status set elsewhere.
  destructive: "#d02752" # white text 5.13:1, icon 3.06:1 on cards
  destructive-foreground: "#f85b6e" # 4.82:1 on its own tint
  success: "#218661" # white text 4.52:1, icon 3.48:1 on cards
  success-foreground: "#34d399" # 7.20:1 on its own tint
  warning: "#947115" # white text 4.53:1, icon 3.47:1 on cards
  warning-foreground: "#fbbf24" # 8.47:1 on its own tint
  info: "#4678b6" # white text 4.54:1, icon 3.46:1 on cards
  info-foreground: "#60a5fa" # 5.44:1 on its own tint

  # Data visualisation (reserved: nothing consumes these yet) ----------------
  chart-1: "#f63049"
  chart-2: "#d02752"
  chart-3: "#ffeff0"
  chart-4: "#8a244b"
  chart-5: "#c99a2e"
