# Grey — built-in theme
#
# Source palette: https://colorhunt.co/palette/f0f5f9c9d6df52616b1e2022
#   #f0f5f9 canvas · #c9d6df sidebar · #52616b primary/muted · #1e2022 text
#
# Both modes: the same palette read in opposite directions, so light and dark
# share one theme rather than living as two near-identical files.

name: "Grey"
description: "Cool grey-blue palette from Color Hunt, light and dark."

light:
  # Surfaces ----------------------------------------------------------------
  background: "#f0f5f9"
  card: "#ffffff"
  popover: "#ffffff"
  sidebar: "#c9d6df"
  muted: "#52616b1a"
  accent: "#52616b1a"
  secondary: "#52616b1a"
  code: "#ffffff"
  code-highlight: "#52616b1a"

  # Text --------------------------------------------------------------------
  foreground: "#1e2022"
  card-foreground: "#1e2022"
  popover-foreground: "#1e2022"
  muted-foreground: "#52616b" # 5.83:1 on the canvas, 6.40:1 on cards
  accent-foreground: "#1e2022"
  secondary-foreground: "#1e2022"
  code-foreground: "#1e2022"
  sidebar-foreground: "#3d4a52" # 6.16:1 on the sidebar

  # Brand and emphasis ------------------------------------------------------
  primary: "#52616b"
  primary-foreground: "#f0f5f9" # 5.83:1 on primary

  # Borders, inputs, focus --------------------------------------------------
  border: "#c9d6df" # decorative hairline (1.35:1); not an affordance
  input: "#868f95" # 3.00:1 on the canvas, 3.29:1 on cards
  ring: "#52616b" # 5.83:1 on the canvas
  sidebar-border: "#52616b33"
  sidebar-ring: "#52616b" # 4.32:1 on the sidebar
  sidebar-primary: "#52616b"
  sidebar-primary-foreground: "#f0f5f9"
  sidebar-accent: "#52616b1f"
  sidebar-accent-foreground: "#1e2022"

  # Status ------------------------------------------------------------------
  # Fills darkened from Kaneo's defaults so they clear 3:1 as icons and carry
  # white button text at 4.5:1; the -foreground roles are the badge text.
  destructive: "#d83d3d" # white text 4.51:1
  destructive-foreground: "#b91c1c" # 5.32:1 on its own tint
  success: "#0c875e" # white text 4.52:1
  success-foreground: "#047656" # 4.64:1 on its own tint
  warning: "#a56a07" # white text 4.50:1
  warning-foreground: "#a94e08" # 4.61:1 on its own tint
  info: "#3473db" # white text 4.54:1
  info-foreground: "#1d4ed8" # 5.56:1 on its own tint

  # Data visualisation (reserved: nothing consumes these yet) ----------------
  chart-1: "#ea580c"
  chart-2: "#0d9488"
  chart-3: "#164e63"
  chart-4: "#fbbf24"
  chart-5: "#f59e0b"

dark:
  # Surfaces ----------------------------------------------------------------
  background: "#1e2022"
  card: "#292b2d"
  popover: "#292b2d"
  sidebar: "#16181a"
  muted: "#c9d6df14"
  accent: "#c9d6df14"
  secondary: "#c9d6df14"
  code: "#292b2d"
  code-highlight: "#c9d6df1a"

  # Text --------------------------------------------------------------------
  foreground: "#f0f5f9"
  card-foreground: "#f0f5f9"
  popover-foreground: "#f0f5f9"
  muted-foreground: "#87939a" # 5.19:1 on the canvas, 4.51:1 on cards
  accent-foreground: "#f0f5f9"
  secondary-foreground: "#f0f5f9"
  code-foreground: "#f0f5f9"
  sidebar-foreground: "#75828a" # 4.51:1 on the sidebar

  # Brand and emphasis ------------------------------------------------------
  primary: "#c9d6df"
  primary-foreground: "#1e2022" # 11.03:1 on primary

  # Borders, inputs, focus --------------------------------------------------
  border: "#c9d6df1f" # decorative hairline; not an affordance
  input: "#68757e" # 3.00:1 on cards, 3.45:1 on the canvas
  ring: "#7c8891" # 4.50:1 on the canvas
  sidebar-border: "#c9d6df24"
  sidebar-ring: "#c9d6df" # 12.01:1 on the sidebar
  sidebar-primary: "#c9d6df"
  sidebar-primary-foreground: "#1e2022"
  sidebar-accent: "#c9d6df14"
  sidebar-accent-foreground: "#f0f5f9"

  # Status ------------------------------------------------------------------
  # Fills sit in the narrow band that is both a 3:1 icon on these surfaces and
  # dark enough for the white text Kaneo's buttons put on them.
  destructive: "#cc4a4a" # white text 4.52:1, icon 3.14:1 on cards
  destructive-foreground: "#f87171" # 5.06:1 on its own tint
  success: "#218661" # white text 4.52:1, icon 3.14:1 on cards
  success-foreground: "#34d399" # 7.21:1 on its own tint
  warning: "#947115" # white text 4.53:1, icon 3.13:1 on cards
  warning-foreground: "#fbbf24" # 8.24:1 on its own tint
  info: "#4678b6" # white text 4.54:1, icon 3.13:1 on cards
  info-foreground: "#60a5fa" # 5.41:1 on its own tint

  # Data visualisation (reserved: nothing consumes these yet) ----------------
  chart-1: "#1d4ed8"
  chart-2: "#10b981"
  chart-3: "#f59e0b"
  chart-4: "#a855f7"
  chart-5: "#f43f5e"
