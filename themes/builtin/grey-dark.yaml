# Grey Dark — built-in theme
#
# Source palette: https://colorhunt.co/palette/f0f5f9c9d6df52616b1e2022
#   #1e2022 canvas · #c9d6df text/primary · #52616b input borders · #87939a muted
#
# Dark only: light mode keeps the instance's own palette.

name: "Grey Dark"
description: "Cool grey-blue palette from Color Hunt, dark mode."

dark:
  # Surfaces ----------------------------------------------------------------
  background: "#1e2022"
  card: "#292b2d"
  popover: "#292b2d"
  sidebar: "#16181a"
  muted: "#c9d6df14"
  accent: "#c9d6df14"
  secondary: "#c9d6df14"
  code: "#292b2d"
  code-highlight: "#c9d6df1a"

  # Text --------------------------------------------------------------------
  foreground: "#f0f5f9"
  card-foreground: "#f0f5f9"
  popover-foreground: "#f0f5f9"
  muted-foreground: "#87939a" # 5.19:1 on the canvas, 4.51:1 on cards
  accent-foreground: "#f0f5f9"
  secondary-foreground: "#f0f5f9"
  code-foreground: "#f0f5f9"
  sidebar-foreground: "#75828a" # 4.51:1 on the sidebar

  # Brand and emphasis ------------------------------------------------------
  primary: "#c9d6df"
  primary-foreground: "#1e2022" # 11.03:1 on primary

  # Borders, inputs, focus --------------------------------------------------
  border: "#c9d6df1f" # decorative hairline; not an affordance
  input: "#68757e" # 3.00:1 on cards, 3.45:1 on the canvas
  ring: "#7c8891" # 4.50:1 on the canvas
  sidebar-border: "#c9d6df24"
  sidebar-ring: "#c9d6df" # 12.01:1 on the sidebar
  sidebar-primary: "#c9d6df"
  sidebar-primary-foreground: "#1e2022"
  sidebar-accent: "#c9d6df14"
  sidebar-accent-foreground: "#f0f5f9"

  # Status ------------------------------------------------------------------
  # Fills sit in the narrow band that is both a 3:1 icon on these surfaces and
  # dark enough for the white text Kaneo's buttons put on them.
  destructive: "#cc4a4a" # white text 4.52:1, icon 3.14:1 on cards
  destructive-foreground: "#f87171" # 5.06:1 on its own tint
  success: "#218661" # white text 4.52:1, icon 3.14:1 on cards
  success-foreground: "#34d399" # 7.21:1 on its own tint
  warning: "#947115" # white text 4.53:1, icon 3.13:1 on cards
  warning-foreground: "#fbbf24" # 8.24:1 on its own tint
  info: "#4678b6" # white text 4.54:1, icon 3.13:1 on cards
  info-foreground: "#60a5fa" # 5.41:1 on its own tint

  # Data visualisation (reserved: nothing consumes these yet) ----------------
  chart-1: "#1d4ed8"
  chart-2: "#10b981"
  chart-3: "#f59e0b"
  chart-4: "#a855f7"
  chart-5: "#f43f5e"

# Light counterpart: same Color Hunt palette, roles inverted for a light
# canvas — the palette Grey Light ships as its primary mode.
light:
  background: "#f0f5f9"
  card: "#ffffff"
  popover: "#ffffff"
  sidebar: "#c9d6df"
  muted: "#52616b1a"
  accent: "#52616b1a"
  secondary: "#52616b1a"
  code: "#ffffff"
  code-highlight: "#52616b1a"
  foreground: "#1e2022"
  card-foreground: "#1e2022"
  popover-foreground: "#1e2022"
  muted-foreground: "#52616b"
  accent-foreground: "#1e2022"
  secondary-foreground: "#1e2022"
  code-foreground: "#1e2022"
  sidebar-foreground: "#3d4a52"
  primary: "#52616b"
  primary-foreground: "#f0f5f9"
  border: "#c9d6df"
  input: "#868f95"
  ring: "#52616b"
  sidebar-border: "#52616b33"
  sidebar-ring: "#52616b"
  sidebar-primary: "#52616b"
  sidebar-primary-foreground: "#f0f5f9"
  sidebar-accent: "#52616b1f"
  sidebar-accent-foreground: "#1e2022"
  destructive: "#d83d3d"
  destructive-foreground: "#b91c1c"
  success: "#0c875e"
  success-foreground: "#047656"
  warning: "#a56a07"
  warning-foreground: "#a94e08"
  info: "#3473db"
  info-foreground: "#1d4ed8"
  chart-1: "#ea580c"
  chart-2: "#0d9488"
  chart-3: "#164e63"
  chart-4: "#fbbf24"
  chart-5: "#f59e0b"
