# Default — built-in theme
#
# Kaneo's own palette, verbatim (apps/web/src/index.css at Kaneo v2.24.0).
# Selecting it makes the app look exactly like the web app, including the few
# stock status colours that miss WCAG AA — kept stock on purpose, so there is
# always an unmodified reference to fall back to.

